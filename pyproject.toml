[project]
name = "disease-prediction"
version = "0.1.0"
description = "Explainable machine learning system for heart disease, diabetes and breast cancer risk prediction from structured patient data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Charles Akinnurun" }]
requires-python = ">=3.11,<3.13"
keywords = ["machine-learning", "healthcare", "explainability", "mlops", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "joblib>=1.3,<2",
    "pyyaml>=6.0,<7",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "streamlit>=1.34,<2",
    "requests>=2.31,<3",
    "shap>=0.45,<1",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/charlesakinnurun/codealpha-disease-prediction"
Issues = "https://github.com/charlesakinnurun/codealpha-disease-prediction/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends in defaults is idiomatic
    "ARG001", # unused function args common in fixtures/handlers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101"]
"notebooks/**" = ["E402"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: tests that train real models or download data (deselect with '-m \"not slow\"')",
    "integration: end-to-end tests spanning multiple components",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src"]

[tool.coverage.run]
source = ["src/disease_prediction"]
omit = ["*/dashboard/*"]
